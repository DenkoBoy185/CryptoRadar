<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CryptoRadar - track live cryptocurrency prices, market caps and 24h changes in one dashboard." />
    <title>CryptoRadar | Live Crypto Prices</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Montserrat:wght@700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/CryptoRadar/assets/main-RTZZJ1iE.js"></script>
    <link rel="modulepreload" crossorigin href="/CryptoRadar/assets/Watchlist-YD3agl3G.js">
    <link rel="modulepreload" crossorigin href="/CryptoRadar/assets/CoinData-BTqBSkTz.js">
    <link rel="modulepreload" crossorigin href="/CryptoRadar/assets/CoinList-BWoDgVro.js">
    <link rel="stylesheet" crossorigin href="/CryptoRadar/assets/Watchlist-BkR7N8x3.css">
  </head>
  <body>
    <header id="main-header"></header>

    <main>
      <h1>Live Crypto Prices</h1>
      <section class="controls" aria-label="Search and sort coins">
        <label class="visually-hidden" for="search-input">Search coins</label>
        <input type="search" id="search-input" placeholder="Search coins (e.g. Bitcoin, ETH)..." />

        <label class="visually-hidden" for="filter-select">Filter coins</label>
        <select id="filter-select">
          <option value="all">All coins</option>
          <option value="gainers">Gainers (24h)</option>
          <option value="losers">Losers (24h)</option>
        </select>

        <label class="visually-hidden" for="sort-select">Sort coins</label>
        <select id="sort-select">
          <option value="market_cap">Sort by Market Cap</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="change_desc">24h Change: Best first</option>
          <option value="change_asc">24h Change: Worst first</option>
        </select>
      </section>

      <section id="coin-list" class="grid-container" aria-live="polite"></section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
